{% extends "index.html" %}

{% block content %}
<article>
    <p><a href="{% url 'articles-list' %}">Усі статті</a></p>

    {% if item.category %}
        <p>
            Категорія:
            <a href="{{ item.category.get_absolute_url }}">
                {{ item.category.category }}
            </a>
        </p>
    {% endif %}

    <h1>{{ item.title }}</h1>

    <p>{{ item.pub_date|date:"d.m.Y H:i" }}</p>

    <div>
        {{ item.description|safe }}
    </div>

    {% if images %}
        {% include "fotorama.html" %}
    {% endif %}
</article>
{% endblock %}
